<!doctype html>
<!-- Source for public/og-image.png (1200x630). Regenerate with:
     node scripts/render-images.cjs   (needs Playwright) -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,500&family=Inter:wght@500;800&family=JetBrains+Mono:wght@500&display=block">
<style>
  body { margin: 0; }
  .og { position: relative; width: 1200px; height: 630px; background: #F2A33A; color: #12355B; font-family: Inter, sans-serif; overflow: hidden; }
  .photo { position: absolute; right: 0; top: 0; bottom: 48px; width: 560px; background: #F2A33A;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.4) 25%, #000 65%);
    mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.4) 25%, #000 65%); }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; filter: grayscale(1) contrast(1.15) brightness(1.05); mix-blend-mode: multiply; }
  .text { position: relative; padding: 64px 72px 0; display: flex; flex-direction: column; gap: 24px; }
  .wordmark { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 28px; }
  h1 { margin: 0; font-weight: 800; font-size: 88px; line-height: 0.92; letter-spacing: -4px; max-width: 720px; }
  h1 em { font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 500; letter-spacing: -2px; }
  p { margin: 0; font-size: 26px; font-weight: 500; color: #1B2430; max-width: 560px; line-height: 1.35; }
  .road { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background-color: #12355B;
    background-image: repeating-linear-gradient(90deg, rgba(250,246,239,0.85) 0 56px, transparent 56px 84px);
    background-size: 100% 6px; background-position: 0 center; background-repeat: no-repeat; }
</style>
</head>
<body>
<div class="og">
  <div class="photo"><img src="../public/photo.jpg" alt=""></div>
  <div class="text">
    <div class="wordmark">Augustine (Austin) Chukwu</div>
    <h1>Software that goes where <em>people</em> actually go.</h1>
    <p>AI and backend engineer building for African businesses</p>
  </div>
  <div class="road"></div>
</div>
</body>
</html>
