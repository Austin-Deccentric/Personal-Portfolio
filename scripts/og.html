<!doctype html>
<!-- Source for public/og-image.png (1200x630). Regenerate with:
     node scripts/render-images.cjs   (needs Playwright) -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@500&family=JetBrains+Mono:wght@500&display=block">
<style>
  body { margin: 0; }
  .og { width: 1200px; height: 630px; box-sizing: border-box; display: flex; background: #FAF6EF; color: #1B2430; font-family: Inter, sans-serif; overflow: hidden; }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: 0 72px; }
  .rule { display: flex; align-items: center; gap: 14px; font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 1.5px; color: #12355B; }
  .rule span { width: 48px; height: 8px; border-radius: 4px; background: #F2A33A; }
  h1 { margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 72px; line-height: 1.05; color: #12355B; letter-spacing: -0.5px; }
  p { margin: 0; font-size: 34px; line-height: 1.35; font-weight: 500; max-width: 760px; }
  .mark { box-shadow: inset 0 -12px 0 #F2A33A; }
  .side { width: 300px; background: #12355B; display: flex; align-items: center; justify-content: center; }
  .mono { width: 160px; height: 160px; border-radius: 32px; border: 3px solid #FAF6EF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 96px; line-height: 1; color: #FAF6EF; }
  .mono i { width: 64px; height: 10px; border-radius: 5px; background: #F2A33A; }
</style>
</head>
<body>
<div class="og">
  <div class="main">
    <div class="rule"><span></span>chukwuaugust.tech</div>
    <h1>Augustine (Austin) Chukwu</h1>
    <p>AI and backend engineer building software for <span class="mark">African businesses</span></p>
  </div>
  <div class="side"><div class="mono">A<i></i></div></div>
</div>
</body>
</html>
